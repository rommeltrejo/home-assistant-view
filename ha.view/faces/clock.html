<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#211b20" />
    <title>HA View Clock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        background: #211b20;
        color: #fff4e5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 0;
        margin: 0;
        overflow: hidden;
      }

      body {
        height: 100vh;
        height: 100dvh;
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: max(clamp(24px, 4vw, 56px), env(safe-area-inset-top))
          max(clamp(24px, 4vw, 56px), env(safe-area-inset-right))
          max(clamp(24px, 4vw, 56px), env(safe-area-inset-bottom))
          max(clamp(24px, 4vw, 56px), env(safe-area-inset-left));
        user-select: none;
        -webkit-user-select: none;
        /* HA.View original artwork: a softly lit, warm horizon, entirely CSS. */
        background:
          radial-gradient(ellipse at 85% 100%, #df945e 0%, transparent 55%),
          radial-gradient(ellipse at 7% 76%, #955769 0%, transparent 58%),
          radial-gradient(ellipse at 54% 1%, #654957 0%, transparent 60%),
          linear-gradient(155deg, #211b20 12%, #3b2932 58%, #694735);
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        z-index: -1;
        pointer-events: none;
      }

      body::before {
        width: 150vmax;
        height: 150vmax;
        left: -26vmax;
        top: 57%;
        border-radius: 50%;
        transform: rotate(-14deg);
        background: linear-gradient(175deg, rgb(255 215 171 / 18%), rgb(184 111 104 / 8%) 12%, transparent 28%);
        border-top: 1px solid rgb(255 226 194 / 13%);
        box-shadow: 0 -24px 90px rgb(232 158 105 / 5%);
      }

      body::after {
        inset: 0;
        background: radial-gradient(ellipse at 50% 46%, transparent 20%, rgb(20 14 20 / 25%) 100%);
      }

      main {
        grid-row: 2;
        min-width: 0;
        align-self: center;
        display: grid;
        justify-items: center;
        gap: clamp(16px, 3vh, 28px);
        padding-bottom: 2vh;
        text-align: center;
      }

      .clock {
        position: relative;
        width: fit-content;
        max-width: 100%;
      }

      #time {
        display: block;
        font-size: min(28vw, 43vh, 360px);
        font-weight: 200;
        line-height: 1;
        letter-spacing: -0.065em;
        font-variant-numeric: tabular-nums lining-nums;
        white-space: nowrap;
        text-shadow: 0 4px 36px rgb(26 17 22 / 12%);
      }

      #period {
        position: absolute;
        left: calc(100% + 18px);
        bottom: 16%;
        color: #e6ccbd;
        font-size: clamp(12px, 1.5vw, 19px);
        font-weight: 500;
        letter-spacing: 0.09em;
      }

      #date {
        max-width: 100%;
        margin: 0;
        color: #f0d9c8;
        font-size: clamp(16px, min(2.25vw, 3.8vh), 28px);
        font-weight: 400;
        line-height: 1.4;
        letter-spacing: 0.045em;
        text-wrap: balance;
      }

      .cue {
        margin: 0;
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ead0bd;
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.5;
        letter-spacing: 0.035em;
      }

      .cue::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #eac1a0;
        box-shadow: 0 0 12px rgb(234 193 160 / 25%);
      }

      @media (orientation: portrait) {
        #time {
          font-size: min(30vw, 32vh, 300px);
        }
        #period {
          position: static;
          display: block;
          margin-top: 12px;
          font-size: 14px;
        }
        #period:empty {
          display: none;
        }
        #date {
          font-size: clamp(16px, 4vw, 25px);
        }
        main {
          gap: 24px;
          padding-bottom: 5vh;
        }
        body::before {
          top: 64%;
          left: -60vmax;
        }
      }

      @media (max-height: 360px) and (orientation: landscape) {
        body {
          padding: 16px 24px;
        }
        main {
          gap: 8px;
          padding-bottom: 0;
        }
        #time {
          font-size: min(25vw, 38vh);
        }
        #date {
          font-size: 14px;
        }
        .cue {
          font-size: 11px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: arrive 800ms ease-out both;
        }
        @keyframes arrive {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Clock face">
      <div class="clock">
        <time id="time" aria-label="Current local time" aria-live="off"></time>
        <span id="period" aria-hidden="true"></span>
      </div>
      <p id="date" aria-label="Current local date"></p>
    </main>
    <script>
      (() => {
        const time = document.querySelector("#time");
        const date = document.querySelector("#date");
        const period = document.querySelector("#period");
        const locale = navigator.language || document.documentElement.lang || undefined;
        const timeFormatter = new Intl.DateTimeFormat(locale, { hour: "numeric", minute: "2-digit" });
        const dateFormatter = new Intl.DateTimeFormat(locale, {
          weekday: "long",
          month: "long",
          day: "numeric",
        });

        const update = () => {
          const now = new Date();
          const parts = timeFormatter.formatToParts(now);
          time.dateTime = now.toISOString();
          time.textContent = parts
            .filter((part) => part.type !== "dayPeriod")
            .map((part) => part.value)
            .join("")
            .trim();
          time.setAttribute("aria-label", timeFormatter.format(now));
          period.textContent = parts.find((part) => part.type === "dayPeriod")?.value || "";
          date.textContent = dateFormatter.format(now);
        };

        const scheduleNextMinute = () => {
          update();
          window.setTimeout(scheduleNextMinute, 60000 - (Date.now() % 60000) + 25);
        };

        // HA.View's existing host hook owns touch dismissal; this face is display-only.
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) update();
        });
        window.addEventListener("pageshow", update);
        scheduleNextMinute();
      })();
    </script>
  </body>
</html>
